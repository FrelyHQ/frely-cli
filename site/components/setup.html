<section class="setup-section section" id="get-started" aria-labelledby="setup-title">
  <div class="wrap">
    <div class="section-heading">
      <div>
        <p class="eyebrow">{{setup.eyebrow}}</p>
        <h2 id="setup-title">{{install.line1}}<br>{{install.line2}}</h2>
      </div>
      <p>{{install.description}}</p>
    </div>
    <div class="setup-step">
      <h3>{{install.step3}}</h3>
      <div class="command">
        <code id="mcp-command">{{command.mcpSetup}}</code>
        <button class="copy-button" data-copy="mcp-command" aria-label="{{copy.mcp}}">{{copy.idle}}</button>
      </div>
      <p class="fineprint">{{install.approval}}</p>
      <p class="fineprint">{{install.next}}</p>
      <a class="text-link" href="#panel-tools">{{install.tools}} <span aria-hidden="true">↗</span></a>
    </div>
    <div class="setup-diagnostics">
      <p class="fineprint">{{install.diagnostics}}</p>
      <div class="command">
        <code id="doctor-command">{{command.doctor}}</code>
        <button class="copy-button" data-copy="doctor-command" aria-label="{{copy.doctor}}">{{copy.idle}}</button>
      </div>
    </div>
  </div>
</section>
