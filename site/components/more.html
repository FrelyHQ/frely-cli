<section class="more-cli wrap section" id="more-cli" aria-labelledby="more-title">
  <div class="section-heading">
    <div>
      <p class="eyebrow">{{more.eyebrow}}</p>
      <h2 id="more-title">{{more.title}}</h2>
    </div>
    <p>{{more.description}}</p>
  </div>
  <div class="device-scenarios">
    <article class="device-scenario" id="panel-models">
      <p class="panel-label">{{models.label}}</p>
      <h3>{{models.tab}}</h3>
      <p>{{models.description}}</p>
      <p class="fineprint">{{models.note}}</p>
      <a class="text-link" href="https://github.com/FrelyHQ/frely-cli#local-model-sharing">{{models.guide}} <span aria-hidden="true">↗</span></a>
    </article>
    <article class="device-scenario" id="panel-agents">
      <p class="panel-label">{{agents.label}}</p>
      <h3>{{agents.tab}}</h3>
      <p>{{agents.description}}</p>
      <p class="fineprint">{{agents.note}}</p>
      <a class="text-link" href="https://github.com/FrelyHQ/frely-cli#invoke-a-frely-hosted-agent">{{agents.guide}} <span aria-hidden="true">↗</span></a>
    </article>
  </div>
</section>
