<section class="open-source wrap section" aria-labelledby="source-title">
  <div>
    <p class="eyebrow">{{source.eyebrow}}</p>
    <h2 id="source-title">{{source.line1}}<br>{{source.line2}}</h2>
    <p>{{source.description}}</p>
    <p class="fineprint">{{source.note}}</p>
  </div>
  <div class="source-actions">
    <a class="button secondary" href="https://github.com/FrelyHQ/frely-cli">{{source.explore}} <span aria-hidden="true">↗</span></a>
    <a class="text-link" href="https://github.com/FrelyHQ/frely-cli/blob/main/CONTRIBUTING.md">{{source.contribute}} <span aria-hidden="true">↗</span></a>
  </div>
</section>
