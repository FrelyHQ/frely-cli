<!doctype html>
<html lang="{{page.lang}}" data-locale-entry="{{page.entry}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101211">
  <meta name="description" content="{{meta.description}}">
  <meta property="og:title" content="{{meta.title}}">
  <meta property="og:description" content="{{meta.socialDescription}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Frely">
  <meta property="og:image" content="https://cli.frely.cloud/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://cli.frely.cloud/{{page.canonical}}">
  <link rel="alternate" hreflang="en" href="https://cli.frely.cloud/">
  <link rel="alternate" hreflang="zh-CN" href="https://cli.frely.cloud/zh/">
  <link rel="alternate" hreflang="x-default" href="https://cli.frely.cloud/">
  <meta property="og:url" content="https://cli.frely.cloud/{{page.canonical}}">
  <meta property="og:locale" content="{{page.ogLocale}}">
  <meta property="og:locale:alternate" content="{{page.ogAlternate}}">
  <title>{{meta.title}}</title>
  <script type="application/ld+json">{{page.jsonLd}}</script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101211'/%3E%3Cpath d='m7 9 7 7-7 7M18 23h7' fill='none' stroke='%23d3fa6a' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{page.base}}styles.css?v={{page.stylesVersion}}">
  <script src="{{page.base}}locale.js?v={{page.localeVersion}}"></script>
  <script src="{{page.base}}app.js?v={{page.appVersion}}" defer></script>
  <noscript><style>.copy-button{display:none}</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main">{{nav.skip}}</a>
  {{> header}}
  <main id="main">
    {{> hero}}
    {{> setup}}
    {{> workflows}}
    {{> device-mcp}}
    {{> more}}
    {{> open-source}}
  </main>
  {{> footer}}
  <p class="sr-only" id="copy-status" data-idle="{{copy.idle}}" data-copied="{{copy.copied}}" data-selected="{{copy.selected}}" data-success="{{copy.success}}" data-failure="{{copy.failure}}" role="status" aria-live="polite"></p>
</body>
</html>
