name: Standalone CLI verification

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  standalone:
    name: Standalone (${{ matrix.os }})
    runs-on: ${{ fromJSON(matrix.runner || format('"{0}"', matrix.os)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        include:
          # macOS runs on the maintainer's Mac (runner frely-cli-macos). A fork's pull request never reaches it: it keeps the GitHub-hosted runner.
          - os: macos-latest
            runner: ${{ github.event.pull_request.head.repo.fork && '"macos-latest"' || '["self-hosted","frely-cli-macos"]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Not on the maintainer's Mac: its persistent ~/.npm is several GB and the post step would upload all of it.
          cache: ${{ (matrix.os == 'macos-latest' && !github.event.pull_request.head.repo.fork) && ' ' || 'npm' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install without dependency lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Type-check and test
        run: npm test
      - name: Build standalone executable
        run: npm run build:standalone
      - name: Run without Node or a configured secure store
        run: npm run test:standalone
      - name: Verify offline installer and checksum rejection
        run: npm run test:installer
