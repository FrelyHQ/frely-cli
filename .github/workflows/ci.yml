name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  native-credentials-macos:
    name: Native credentials (macOS, GitHub-hosted)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify native credential persistence on macOS
        run: npm run test:credentials

  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ fromJSON(matrix.runner || format('"{0}"', matrix.os)) }}
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the engines floor and runs everywhere; Node 24 only on Linux to catch newer-runtime breakage.
        node: [22]
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
        include:
          - os: ubuntu-24.04
            node: 24
          # macOS runs on the maintainer's Mac (runner frely-cli-macos). A fork's pull request never reaches it: it keeps the GitHub-hosted runner.
          - os: macos-latest
            runner: ${{ github.event.pull_request.head.repo.fork && '"macos-latest"' || '["self-hosted","frely-cli-macos"]' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # Not on the maintainer's Mac: its persistent ~/.npm is several GB and the post step would upload all of it.
          cache: ${{ (matrix.os == 'macos-latest' && !github.event.pull_request.head.repo.fork) && ' ' || 'npm' }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify packed installation without lifecycle scripts
        run: npm run test:install

      # The Mac runner is a background service without an unlocked login keychain, and the check must not touch the owner's real keychain,
      # so on the self-hosted Mac it runs in the `native-credentials-macos` job below, on a GitHub-hosted Mac.
      - name: Verify native credential persistence on macOS and Windows
        if: runner.os != 'Linux' && runner.environment != 'self-hosted'
        run: npm run test:credentials

      - name: Install Linux test credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11

      - name: Verify Linux Secret Service persistence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/keyrings"
          now="$(date +%s)"
          cat > "$HOME/.local/share/keyrings/login.keyring" <<KEYRING
          [keyring]
          display-name=login
          ctime=$now
          mtime=0
          lock-on-idle=false
          lock-after=false
          KEYRING
          chmod 600 "$HOME/.local/share/keyrings/login.keyring"

          DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --print-address --fork)"
          export DBUS_SESSION_BUS_ADDRESS
          gnome-keyring-daemon --start --components=secrets >/dev/null

          probe='{"version":1,"type":"oauth","accessToken":"synthetic-access"}'
          for _ in $(seq 1 50); do
            if printf '%s' "$probe" | timeout 5s secret-tool store \
                --label='Frely CLI' service frely-ci account probe >/dev/null 2>&1 &&
               test "$(timeout 5s secret-tool lookup service frely-ci account probe)" = "$probe"; then
              secret-tool clear service frely-ci account probe >/dev/null 2>&1 || true
              node scripts/credential-smoke.mjs
              exit 0
            fi
            sleep 0.1
          done
          echo "Secret Service did not become writable" >&2
          exit 1
