name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify packed installation without lifecycle scripts
        run: npm run test:install

      - name: Verify native credential persistence on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:credentials

      - name: Install Linux test credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11

      - name: Verify Linux Secret Service persistence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- sh -ec '
            printf "%s" "ci-synthetic-keyring-password" | gnome-keyring-daemon --unlock --components=secrets
            node scripts/credential-smoke.mjs
          '
