name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify packed installation without lifecycle scripts
        run: npm run test:install

      - name: Verify native credential persistence on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:credentials

      - name: Install Linux test credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11

      - name: Verify Linux Secret Service persistence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Use a fresh HOME and let gnome-keyring create its own login keyring.
          # Validate Secret Service read/write before running the CLI credential smoke test.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -euo pipefail -c '
            export HOME="${RUNNER_TEMP}/frely-keyring-home"
            export XDG_DATA_HOME="$HOME/.local/share"
            mkdir -p "$XDG_DATA_HOME/keyrings"
            chmod 700 "$HOME" "$XDG_DATA_HOME" "$XDG_DATA_HOME/keyrings"

            password="ci-synthetic-keyring-password"
            printf "%s" "$password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null

            for _ in $(seq 1 50); do
              if printf "%s" "probe-value" | timeout 5s secret-tool store \
                  --label="frely-ci-probe" service frely-ci account probe >/dev/null 2>&1 &&
                 test "$(timeout 5s secret-tool lookup service frely-ci account probe)" = "probe-value"; then
                secret-tool clear service frely-ci account probe >/dev/null 2>&1 || true
                node scripts/credential-smoke.mjs
                exit 0
              fi
              sleep 0.1
            done
            echo "Secret Service did not become writable" >&2
            exit 1
          '
