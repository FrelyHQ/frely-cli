name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify packed installation without lifecycle scripts
        run: npm run test:install

      - name: Verify native credential persistence on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:credentials

      - name: Install Linux test credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11

      - name: Verify Linux Secret Service persistence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The single-quoted payload is evaluated by the nested Bash process.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -euo pipefail -c '
            export HOME="${RUNNER_TEMP}/frely-keyring-home"
            mkdir -p "$HOME/.local/share/keyrings"
            chmod 700 "$HOME/.local/share/keyrings"
            printf "%s\n" \
              "[keyring]" \
              "display-name=login" \
              "ctime=1" \
              "mtime=0" \
              "lock-on-idle=false" \
              "lock-after=false" \
              > "$HOME/.local/share/keyrings/login.keyring"
            chmod 600 "$HOME/.local/share/keyrings/login.keyring"
            gnome-keyring-daemon --start --components=secrets >/dev/null
            for _ in $(seq 1 50); do
              if gdbus call --session \
                --dest org.freedesktop.DBus \
                --object-path /org/freedesktop/DBus \
                --method org.freedesktop.DBus.GetNameOwner \
                org.freedesktop.secrets >/dev/null 2>&1; then
                node scripts/credential-smoke.mjs
                exit 0
              fi
              sleep 0.1
            done
            echo "Secret Service did not register on D-Bus" >&2
            exit 1
          '
