name: Publish npm package and standalone release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-frely-cli
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Keep the annotated tag object; the default event-SHA fallback peels it.
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate annotated tag, package version and source on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release --validate-tag "$RELEASE_TAG"

  verify:
    needs: identity
    uses: ./.github/workflows/ci.yml

  standalone:
    needs: identity
    uses: ./.github/workflows/standalone.yml

  release-assets:
    needs: [verify, standalone]
    name: Release asset (${{ matrix.target }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - linux-arm64-musl
          - linux-x64-musl
          - windows-arm64
          - windows-x64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build standalone target
        run: npm run build:standalone -- "${{ matrix.target }}"

      - name: Upload release target
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: artifacts/frely-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, standalone, release-assets]
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v${tag_version} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm_tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          npm publish --access public --tag "$npm_tag"

  github-release:
    needs: [publish, release-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Download standalone artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            darwin-arm64 darwin-x64
            linux-arm64 linux-x64 linux-arm64-musl linux-x64-musl
            windows-arm64 windows-x64
          )
          for target in "${targets[@]}"; do
            suffix=""
            [[ "$target" == windows-* ]] && suffix=".exe"
            test -f "artifacts/frely-${target}${suffix}"
            test -f "artifacts/frely-${target}${suffix}.sha256"
          done
          (cd artifacts && for checksum in frely-*.sha256; do sha256sum -c "$checksum"; done)
          cp install.sh install.ps1 start.sh start.ps1 artifacts/
          find artifacts -maxdepth 1 -type f -print | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag \
            --title "frely-cli $GITHUB_REF_NAME" \
            --generate-notes

  mirror:
    # Static mirror of the release assets for networks that cannot reach GitHub (mainland China).
    # Skipped until the MIRROR_* secrets exist; the GitHub release above is the source of truth.
    needs: [github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MIRROR_HOST: ${{ secrets.MIRROR_HOST }}
    steps:
      - name: Check out release tag
        if: env.MIRROR_HOST != ''
        uses: actions/checkout@v5

      - name: Download standalone artifacts
        if: env.MIRROR_HOST != ''
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Upload to the mirror
        if: env.MIRROR_HOST != ''
        env:
          MIRROR_USER: ${{ secrets.MIRROR_USER }}
          MIRROR_PATH: ${{ secrets.MIRROR_PATH }}
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh install.ps1 start.sh start.ps1 artifacts/
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          node scripts/release-mirror.mjs artifacts "${GITHUB_REF_NAME#v}"
