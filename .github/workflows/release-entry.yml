name: Release entry contracts

on:
  push:
    branches: [main]
    paths: ['scripts/release*', '.github/workflows/*']
  pull_request:
    paths: ['scripts/release*', '.github/workflows/*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/release-entry.test.mjs
