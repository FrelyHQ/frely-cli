name: Deploy CLI landing

on:
  push:
    tags: ['landing/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated landing/v tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate tag and source
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/release --validate-tag "$RELEASE_TAG"

      - name: Prepare static website
        env:
          RELEASE_SHA: ${{ steps.identity.outputs.source_sha }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          node --check site/app.js
          node --check site/locale.js
          node --test site/*.test.mjs
          node site/build.mjs
          node -e 'require("node:fs").writeFileSync("_site/release.json", JSON.stringify({sourceSha: process.env.RELEASE_SHA, version: process.env.RELEASE_VERSION}) + "\n")'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed source marker
        env:
          EXPECTED_SHA: ${{ steps.identity.outputs.source_sha }}
        run: node scripts/verify-site-release.mjs
