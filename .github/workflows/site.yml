name: Deploy CLI landing

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'LICENSE'
      - 'NOTICE'
      - 'TRADEMARKS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare static website
        run: |
          node --check site/app.js
          node --check site/locale.js
          node --test site/*.test.mjs
          node site/build.mjs
          node -e 'require("node:fs").writeFileSync("_site/release.json", JSON.stringify({sourceSha: process.env.GITHUB_SHA}) + "\n")'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
